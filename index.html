<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Self Earn</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='10056839' data-sdk='show_10056839'></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 24px 16px;
    }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px 28px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* Title */
    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: #111;
      text-align: center;
      line-height: 1.3;
    }

    /* Points box */
    .points-box {
      width: 100%;
      background: #f0f0f0;
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
    }

    .points-num {
      font-size: 36px;
      font-weight: 800;
      color: #22c55e;
      line-height: 1;
      margin-bottom: 6px;
    }

    .points-label {
      font-size: 15px;
      font-weight: 500;
      color: #555;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      color: #fff;
    }

    .btn:active  { transform: scale(0.98); }
    .btn:hover   { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-blue  { background: #1a7eff; }
    .btn-green { background: #22c55e; }

    /* Withdraw modal */
    .modal-overlay {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .modal h3 { font-size: 18px; font-weight: 800; color: #111; margin-bottom: 8px; }
    .modal p  { font-size: 14px; color: #777; margin-bottom: 20px; line-height: 1.5; }

    .modal-pts {
      font-size: 32px;
      font-weight: 800;
      color: #22c55e;
      margin-bottom: 20px;
    }

    .modal-close {
      width: 100%;
      padding: 14px;
      background: #111;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    /* Blocked */
    .blocked {
      display: flex;
      text-align: center;
      padding: 0 24px;
    }
    .blocked .block-icon { font-size: 52px; margin-bottom: 16px; }
    .blocked h2 { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .blocked p  { font-size: 14px; color: #777; line-height: 1.6; }

    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #111;
      color: #fff; padding: 11px 22px;
      border-radius: 50px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: transform 0.3s, opacity 0.3s;
      white-space: nowrap; z-index: 200;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok   { background: #22c55e; }
    .toast.err  { background: #ef4444; }
  </style>
</head>
<body>

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">

    <div class="card-title">Telegram Mini Self Earning App</div>

    <div class="points-box">
      <div class="points-num" id="pointsNum">0</div>
      <div class="points-label">Total Points</div>
    </div>

    <button class="btn btn-blue" id="adBtn" onclick="showAd()">
      Reward Interstitial
    </button>


  </div>



  <div class="toast" id="toast"></div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  // ── Country check ──
  // All countries allowed

  // ── Storage ──
  var tgUser = Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
  var userId = tgUser ? String(tgUser.id) : 'guest';
  var KEY = 'selfearn_pts_' + userId;

  function getPts()  { try { return parseInt(localStorage.getItem(KEY)||'0'); } catch(e){ return 0; } }
  function savePts(n){ try { localStorage.setItem(KEY, String(n)); } catch(e){} }

  document.getElementById('pointsNum').textContent = getPts();

  // ── Toast ──
  function toast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast '+type+' show';
    setTimeout(function(){ t.className='toast'; }, 2600);
  }

  // ── Show Ad ──
  function showAd() {
    var btn = document.getElementById('adBtn');
    btn.disabled = true; btn.textContent = 'Loading...';

    // Safety timeout — reset button after 12 seconds if stuck
    var timeout = setTimeout(function(){
      btn.disabled = false;
      btn.textContent = 'Reward Interstitial';
      toast('⚠️ Ad not loaded. Try again.', 'err');
    }, 12000);

    // Check if SDK loaded
    if (typeof show_10056839 !== 'function') {
      clearTimeout(timeout);
      btn.disabled = false;
      btn.textContent = 'Reward Interstitial';
      toast('❌ Ad SDK not ready. Reload app.', 'err');
      return;
    }

    show_10056839().then(function(){
      clearTimeout(timeout);
      var n = getPts() + 10;
      savePts(n);
      document.getElementById('pointsNum').textContent = n;
      toast('✅ +10 Points Earned!', 'ok');
    }).catch(function(){
      clearTimeout(timeout);
      toast('❌ Ad Failed or Closed', 'err');
    }).finally(function(){
      clearTimeout(timeout);
      btn.disabled = false;
      btn.textContent = 'Reward Interstitial';
    });
  }

</script>

</body>
</html>
